<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>window.addEventListener("error",function(e){var b=document.createElement("div");b.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#b00020;color:#fff;padding:10px;font:14px sans-serif;z-index:9999;direction:ltr";b.textContent="Error: "+e.message;document.body?document.body.appendChild(b):document.documentElement.appendChild(b)})</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a5f8a">
<link rel="icon" href="icon-192.png">
<title>أذكار الصباح والمساء</title>

<style>
@font-face{font-family:Amiri;font-weight:400;src:url(fonts/amiri-arabic-400-normal.woff2) format("woff2")}
@font-face{font-family:Amiri;font-weight:700;src:url(fonts/amiri-arabic-700-normal.woff2) format("woff2")}
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo-arabic-400-normal.woff2) format("woff2")}
@font-face{font-family:Cairo;font-weight:600;src:url(fonts/cairo-arabic-600-normal.woff2) format("woff2")}
</style>
<style>
:root{--bg:#f7f1e6;--card:#fffaf1;--ink:#1d2f4a;--mut:#6b7587;--acc:#2a5f8a;--onacc:#fff;--gold:#9a6a1f;--acc2:#e8eef3;--line:#e0d4bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a28;--card:#172536;--ink:#f1e8d6;--mut:#9aa8bb;--acc:#7fb4dc;--onacc:#0e1a28;--gold:#e0b25c;--acc2:#1f3347;--line:#2c4058}}
:root[data-theme="dark"]{--bg:#101a28;--card:#172536;--ink:#f1e8d6;--mut:#9aa8bb;--acc:#7fb4dc;--onacc:#0e1a28;--gold:#e0b25c;--acc2:#1f3347;--line:#2c4058}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:Amiri,serif;font-size:26px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.ic{background:var(--acc2);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.bar{height:6px;background:var(--line);border-radius:6px;margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:20px 18px;margin:14px 0}
.ttl{color:var(--gold);font-weight:600;font-size:15px;margin-bottom:10px}
.txt{font-family:Amiri,serif;font-size:26px;line-height:2.1;text-align:center;white-space:pre-line}
.vir{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);color:var(--mut);font-size:14px;line-height:1.8}
.src{color:var(--mut);font-size:12px;margin-top:6px}
.tap{display:block;width:100%;margin:8px 0;padding:18px;border-radius:16px;border:0;background:var(--acc);color:#fff;font-size:22px;font-weight:600}
.tap:disabled{background:var(--line);color:var(--mut)}
.nav{display:flex;gap:10px}.nav button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.list{display:none;margin-top:10px}.list.on{display:block}
.list button{display:flex;justify-content:space-between;width:100%;text-align:right;padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.list .done{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.card{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s,background .2s}
.card:active{transform:scale(.99)}
.card.done{border-color:var(--line);background:var(--acc2)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.top .ttl{margin:0}
.badge{flex:none;min-width:64px;text-align:center;background:var(--acc);color:var(--onacc);border-radius:999px;padding:6px 14px;font-weight:600;font-size:18px}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:-6px 0 10px}
.row{display:flex;gap:6px;margin-bottom:6px}
.row .go{flex:1;display:flex;justify-content:space-between;text-align:right;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin:0}
.row .go.cur{border-color:var(--acc);border-width:2px}
.row .mv{width:44px;border-radius:10px;border:1px solid var(--line);background:var(--acc2);margin:0;padding:0;justify-content:center}
.lt{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
<header><h1>أذكار الصباح والمساء</h1></header>
<div class="tools"><button class="ic" id="lb">الفهرس والترتيب</button><button class="ic" id="th">الوضع: تلقائي</button><button class="ic" id="rs">من البداية</button></div>
<div class="bar"><i id="pb"></i></div>
<div class="meta"><span id="pos"></span><span id="tot"></span></div>
<div class="list" id="list"></div>
<div class="card" id="card" role="button" tabindex="0" aria-label="اضغطي للعد">
<div class="top"><div class="ttl" id="ttl"></div><div class="badge" id="bd"></div></div>
<div class="txt" id="txt"></div><div class="vir" id="vir"></div><div class="src" id="src"></div></div>
<div class="hint">اضغطي على الذكر للعد</div>
<div class="nav"><button id="pv">السابق</button><button id="un">تراجع</button><button id="nx">التالي</button></div>
</div>
<script>
const D=[
{t:"أعوذ بالله من الشيطان الرجيم",x:"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ",c:1},
{t:"سورة الفاتحة",x:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ﴿٢﴾ الرَّحْمَنِ الرَّحِيمِ ﴿٣﴾ مَالِكِ يَوْمِ الدِّينِ ﴿٤﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿٥﴾ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ﴿٦﴾ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ ﴿٧﴾ آمين",c:1},
{t:"أول سورة البقرة",x:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nالم ﴿١﴾ ذَلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ هُدًى لِلْمُتَّقِينَ ﴿٢﴾ الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ ﴿٣﴾ وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنْزِلَ إِلَيْكَ وَمَا أُنْزِلَ مِنْ قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ ﴿٤﴾ أُولَئِكَ عَلَى هُدًى مِنْ رَبِّهِمْ وَأُولَئِكَ هُمُ الْمُفْلِحُونَ ﴿٥﴾",c:1},
{t:"آية الكرسي",x:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾",c:1},
{t:"آخر سورة البقرة",x:"آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ﴿٢٨٥﴾ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿٢٨٦﴾",c:1},
{t:"سورة الإخلاص",x:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ﴿٤﴾",c:3,v:"من قرأها كفته من كل شيء (تُقال ثلاث مرات صباحًا ومساءً)."},
{t:"سورة الفلق",x:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِنْ شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾",c:3},
{t:"سورة الناس",x:"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَهِ النَّاسِ ﴿٣﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾",c:3,v:"من قرأها كفته من كل شيء، ولا يزال عليه من الله حافظ حتى يمسي (ومن قرأها ليلًا حتى يصبح)."},
{t:"أصبحنا وأصبح الملك لله",x:"أصبحنا وأصبح الملك لله والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذا اليوم وخير ما بعده، وأعوذ بك من شر ما في هذا اليوم وشر ما بعده، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب في النار وعذاب في القبر.",c:1,s:"الترمذي ٥/٤٦٦ — انظر صحيح الترمذي",v:"(في المساء يُقال: أمسينا وأمسى الملك لله...)"},
{t:"أعوذ بكلمات الله التامات",x:"أعوذ بكلمات الله التامات من شر ما خلق",c:3,v:"من قالها ثلاث مرات صباحًا ومساءً لم يضره شيء.",s:"أبو داود والترمذي وصحيح ابن ماجه ٣٣٢/٢"},
{t:"اللهم إني أعوذ بك من الهم والحزن",x:"اللهم إني أعوذ بك من الهم والحزن، وأعوذ بك من العجز والكسل، وأعوذ بك من الجبن والبخل، وأعوذ بك من غلبة الدين وقهر الرجال.",c:1,v:"من قالها صباحًا ومساءً أذهب الله همه وقضى دينه.",s:"أبو داود"},
{t:"اللهم إني أسألك العفو والعافية",x:"اللهم إني أسألك العفو والعافية في الدنيا والآخرة، اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي، اللهم استر عوراتي وآمن روعاتي، اللهم احفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي، وأعوذ بعظمتك أن أغتال من تحتي.",c:1,v:"تُقال صباحًا ومساءً."},
{t:"بسم الله الذي لا يضر مع اسمه شيء",x:"بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم",c:3,v:"من قالها ثلاث مرات لم يضره شيء.",s:"أبو داود والترمذي وقال حديث حسن صحيح"},
{t:"سبحان الله وبحمده عدد خلقه",x:"سبحان الله وبحمده عدد خلقه ورضا نفسه وزنة عرشه ومداد كلماته",c:3,s:"مسلم ٤/٢٠٩٠"},
{t:"يا حي يا قيوم",x:"يا حي يا قيوم برحمتك أستغيث، أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين",c:1,s:"الحاكم وصححه ووافقه الذهبي — صحيح الترغيب والترهيب ٢٧٣/١"},
{t:"أصبحنا على فطرة الإسلام",x:"أصبحنا على فطرة الإسلام وعلى كلمة الإخلاص، وعلى دين محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم حنيفًا مسلمًا وما كان من المشركين.",c:1,s:"أحمد ٣/٤٠٦ و٤٠٧ وابن السني — صحيح الجامع ٤/٢٠٩"},
{t:"اللهم أنت ربي لا إله إلا أنت عليك توكلت",x:"اللهم أنت ربي لا إله إلا أنت عليك توكلت وأنت رب العرش العظيم، ما شاء الله كان وما لم يشأ لم يكن، ولا حول ولا قوة إلا بالله العلي العظيم، أعلم أن الله على كل شيء قدير، وأن الله قد أحاط بكل شيء علمًا، اللهم إني أعوذ بك من شر نفسي ومن شر كل دابة أنت آخذ بناصيتها، إن ربي على صراط مستقيم.",c:1,v:"من قالها أول النهار لم تصبه مصيبة حتى يمسي، ومن قالها آخر النهار لم تصبه مصيبة حتى يصبح.",s:"رواه السني وأبو داود عن بعض بنات النبي صلى الله عليه وسلم"},
{t:"اللهم إني أسألك علمًا نافعًا",x:"اللهم إني أسألك علمًا نافعًا ورزقًا طيبًا وعملًا متقبلًا",c:1,v:"تُقال بعد السلام من صلاة الفجر.",s:"صحيح الزوائد ١١١/١٠"},
{t:"لا إله إلا أنت سبحانك",x:"لا إله إلا أنت سبحانك إني كنت من الظالمين",c:3,v:"ما دعا بها مهموم ولا مغموم ولا مكروب ولا مديون في ثلاث مرات إلا استجيب له.",s:"رواه الديلمي عن عبد الرحمن بن عوف"},
{t:"سبحان الله وبحمده (مائة مرة)",x:"سبحان الله وبحمده",c:100,v:"من قالها مائة مرة حين يصبح وحين يمسي لم يأت أحد يوم القيامة بأفضل مما جاء به إلا أحد قال مثل ما قال أو زاد عليه.",s:"مسلم ٤/٢٠٧١"},
{t:"اللهم بك أصبحنا وبك أمسينا",x:"اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور\n\nوإذا أمسى قال: اللهم بك أمسينا وبك أصبحنا وبك نموت وبك نحيا وإليك المصير",c:1,s:"صحيح الترمذي ١٤٢/٣ وأبو داود ٥٠٦٨ وابن ماجه ١١٩٩"},
{t:"لا إله إلا الله وحده لا شريك له (مائة مرة)",x:"لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير",c:100,v:"من قالها مائة مرة في يوم كانت له عدل عشر رقاب، وكتب له مائة حسنة، ومحيت عنه مائة سيئة، وكانت له حرزًا من الشيطان يومه ذلك حتى يمسي، ولم يأت أحد بأفضل مما جاء به إلا أحد عمل أكثر من ذلك.",s:"البخاري ٤/٩٥ ومسلم ٤/٢٠٧١"},
{t:"أستغفر الله وأتوب إليه (مائة مرة)",x:"أستغفر الله وأتوب إليه",c:100,s:"البخاري مع الفتح ١٠١/١١ ومسلم ٤/٢٠٧٥"},

{t:"اللهم ما أصبح بي من نعمة",x:"اللهم ما أصبح (أمسى) بي من نعمة أو بأحد من خلقك فمنك وحدك لا شريك لك، فلك الحمد ولك الشكر",c:1}
];
const $=id=>document.getElementById(id);
const ar=v=>String(v).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const def=D.map((_,k)=>k);
let ord=def.slice(),i=0,n=D.map(()=>0),edit=false;
const R=document.documentElement;
function save(){try{localStorage.setItem("adhkar2",JSON.stringify({ord,i,n}))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem("adhkar2")||"null");
 if(s&&s.ord&&s.n&&s.ord.length===D.length&&s.n.length===D.length&&[...s.ord].sort((a,b)=>a-b).every((v,k)=>v===k)){ord=s.ord;n=s.n;i=Math.min(s.i||0,D.length-1)}}catch(e){}
let th="auto";try{th=localStorage.getItem("adhkar-theme")||"auto"}catch(e){}
function applyTheme(){
 if(th==="auto")R.removeAttribute("data-theme");else R.setAttribute("data-theme",th);
 $("th").textContent="الوضع: "+({auto:"تلقائي",dark:"داكن",light:"فاتح"})[th];
 const bg=getComputedStyle(document.body).backgroundColor;
 try{localStorage.setItem("adhkar-theme",th)}catch(e){}
}
$("th").onclick=()=>{th=th==="auto"?"dark":th==="dark"?"light":"auto";applyTheme()};
function render(){
 const id=ord[i],d=D[id],c=n[id];
 $("ttl").textContent=d.t;$("txt").textContent=d.x;
 $("vir").textContent=d.v||"";$("vir").style.display=d.v?"block":"none";
 $("src").textContent=d.s||"";
 $("bd").textContent=d.c>1?ar(c)+" / "+ar(d.c):(c>=1?"✓ تم":"مرة");
 $("card").classList.toggle("done",c>=d.c);
 $("pos").textContent="الذكر "+ar(i+1)+" من "+ar(D.length);
 const done=ord.filter(k=>n[k]>=D[k].c).length;
 $("tot").textContent="أُنجز "+ar(done);
 $("pb").style.width=(done/D.length*100)+"%";
 $("pv").disabled=i===0;$("nx").disabled=i===D.length-1;
 $("lb").textContent=$("list").classList.contains("on")?"إغلاق الفهرس":"الفهرس والترتيب";
 $("list").innerHTML='<div class="lt"><button class="ic" data-a="em">'+(edit?"تم الترتيب":"تعديل الترتيب")+'</button>'+(edit?'<button class="ic" data-a="ro">الترتيب الأصلي</button>':'')+'</div>'+
  ord.map((k,p)=>'<div class="row"><button class="go'+(p===i?' cur':'')+(n[k]>=D[k].c?' done':'')+'" data-a="go" data-k="'+p+'"><span>'+ar(p+1)+'. '+D[k].t+'</span><span>'+(n[k]>=D[k].c?'✓':ar(n[k])+'/'+ar(D[k].c))+'</span></button>'+
  (edit?'<button class="mv" data-a="up" data-k="'+p+'" aria-label="لأعلى">▲</button><button class="mv" data-a="dn" data-k="'+p+'" aria-label="لأسفل">▼</button>':'')+'</div>').join("");
 save();
}
function tap(){
 const id=ord[i],d=D[id];
 if(n[id]<d.c){n[id]++;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
 render();
 if(n[id]>=d.c&&i<D.length-1){const cur=i;setTimeout(()=>{if(i===cur){i++;render();window.scrollTo({top:0,behavior:"smooth"})}},350)}
}
$("card").onclick=tap;
$("card").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap()}};
$("un").onclick=()=>{const id=ord[i];if(n[id]>0){n[id]--;render()}};
$("nx").onclick=()=>{if(i<D.length-1){i++;render()}};
$("pv").onclick=()=>{if(i>0){i--;render()}};
$("lb").onclick=()=>{$("list").classList.toggle("on");render()};
$("rs").onclick=()=>{if(confirm("تصفّري العدادات وتبدأي من الأول؟ (الترتيب هيفضل زي ما هو)")){n=D.map(()=>0);i=0;render()}};
function mv(p,q){if(q<0||q>=ord.length)return;const cur=ord[i];[ord[p],ord[q]]=[ord[q],ord[p]];i=ord.indexOf(cur);render()}
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,k=+b.dataset.k;
 if(a==="go"){i=k;$("list").classList.remove("on");edit=false;render();window.scrollTo({top:0})}
 else if(a==="up")mv(k,k-1);else if(a==="dn")mv(k,k+1);
 else if(a==="em"){edit=!edit;render()}
 else if(a==="ro"){if(confirm("ترجعي الترتيب الأصلي؟")){const cur=ord[i];ord=def.slice();i=ord.indexOf(cur);render()}}};
applyTheme();render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
